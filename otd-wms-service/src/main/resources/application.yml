spring:
  application:
    name: otd-wms
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 存量库无 Flyway 历史：基线到 V1，仅执行 V2 及之后的变更脚本
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    # 迁移使用独立连接，避免 Druid WallFilter 拦截幂等守卫所需的 PREPARE/EXECUTE
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    driver-class-name: ${spring.datasource.driver-class-name}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: otd-wms
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mybatis-plus:
  type-aliases-package: net.hwyz.iov.cloud.otd.wms.service.infrastructure.persistence.po
  mapper-locations: classpath*:mappers/**/*.xml

wms:
  default-warehouse:
    # 未显式指定仓库时使用的缺省仓库代码；为空表示必须显式指定（否则 302002）
    code: ${WMS_DEFAULT_WAREHOUSE_CODE:}
  kafka:
    topics:
      vehicle-produce: vmd.vehicle-produce
      outbound-requested: wms.vehicle-outbound.requested
      outbound-changed: wms.vehicle-outbound.changed
      vehicle-produce-dlq: vmd.vehicle-produce.wms.dlq
      outbound-requested-dlq: wms.vehicle-outbound.requested.wms.dlq
    consumer:
      vehicle-produce-group: otd-wms-vehicle-produce
      outbound-command-group: otd-wms-vehicle-outbound-command
      auto-startup: true
      retry:
        max-attempts: 3
        backoff-ms: 1000
    provisioning:
      partitions: 3
      replication-factor: 1
  outbox:
    relay:
      enabled: true
      scan-interval-ms: 10000
      batch-size: 100
      max-retry: 5
      retry-interval-seconds: 30
